<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- This creates a dark blue square with rounded corners to match your nav bar -->
  <rect width="100" height="100" rx="15" fill="#102d43"/>
  
  <!-- This adds the "RAJ" text in the center in bold white font -->
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="32">RAJ</text>
</svg>
